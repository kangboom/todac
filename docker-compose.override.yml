services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./main.py:/app/main.py
    environment:
      - DEBUG=True
  worker: 
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./app:/app/app
      - ./main.py:/app/main.py
    environment:
      - DEBUG=True
  prometheus:
    ports:
      - "9090:9090"
  grafana:
    ports:
      - "3002:3000"
