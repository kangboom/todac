global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "todac-fastapi"
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:8000

  # ingest 중 메모리 증가를 관찰하기 위해 cAdvisor와 동일한 1초 주기로 수집
  - job_name: "todac-cadvisor"
    scrape_interval: 1s
    scrape_timeout: 1s
    metrics_path: /metrics
    static_configs:
      - targets:
          - cadvisor:8080
