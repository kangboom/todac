name: Backend Auto Deploy (FastAPI + DBs)

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스 코드 가져오기
      - name: Checkout Code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # 2. Docker Hub 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. FastAPI 이미지 빌드 및 푸시
      # (DB나 Milvus는 공식 이미지를 쓰므로 빌드할 필요 없음)
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          # ★ docker-compose.yml에 적은 image 이름과 똑같이!
          tags: ${{ secrets.DOCKER_USERNAME }}/todac-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # 4. docker-compose.yml 파일 서버로 배달
      - name: Copy docker-compose files to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          # Compose와 Prometheus/Grafana 설정을 함께 전송
          source: "docker-compose.yml,docker-compose.prod.yml,monitoring"
          target: "~/backend"

      # 5. 서버 접속 및 배포 실행
      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          # 타임아웃 넉넉하게
          timeout: 40s
          command_timeout: 30m
          
          script: |
            echo "🚧 백엔드 배포 시작..."
            
            # Docker Hub 로그인
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            
            cd ~/backend
            
            # .env 파일 생성
            echo "${{ secrets.ENV_FILE }}" > .env
            
            # 네트워크 생성 (없으면 생성)
            docker network create npm_network || true
            
            # 최신 이미지 다운로드
            docker pull ${{ secrets.DOCKER_USERNAME }}/todac-backend:latest
            
            # 배포용 설정 적용하여 컨테이너 실행
            # docker-compose.yml (기본) + docker-compose.prod.yml (배포 설정)
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans

            # bind mount된 수집 설정과 대시보드 등록 설정을 새로 읽도록 모니터링 서비스만 재생성
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps --force-recreate prometheus grafana
            
            # 뒷정리
            docker image prune -f
            echo "✅ 백엔드 배포 완료!"
