services:
  migrate:
    image: kangbb/todac-backend:latest
    container_name: todac-migrate
    command: ["alembic", "upgrade", "head"]
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - todac-network

  # FastAPI 백엔드 서버
  backend:
    image: kangbb/todac-backend:latest
    container_name: todac-backend
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLAMAPARSE_API_KEY=${LLAMAPARSE_API_KEY:-}
      - OPENAI_MODEL_INTENT=${OPENAI_MODEL_INTENT:-gpt-4o-mini}
      - OPENAI_MODEL_GENERATION=${OPENAI_MODEL_GENERATION:-gpt-4o-mini}
      - OPENAI_MODEL_EMBEDDING=${OPENAI_MODEL_EMBEDDING:-text-embedding-3-small}
      - DOCLING_PAGE_BATCH_SIZE=${DOCLING_PAGE_BATCH_SIZE:-5}
      - MAX_RAG_RETRIEVAL_ATTEMPTS=${MAX_RAG_RETRIEVAL_ATTEMPTS:-3}
      - MIN_RAG_SCORE_THRESHOLD=${MIN_RAG_SCORE_THRESHOLD:-0.7}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-True}
      - COACHING_V2_ENABLED=${COACHING_V2_ENABLED:-false}
      - COACHING_MAX_ADJUSTMENTS=${COACHING_MAX_ADJUSTMENTS:-3}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - todac-network

  # TaskIQ Worker
  worker:
    image: kangbb/todac-backend:latest
    container_name: todac-worker
    command: ["taskiq", "worker", "app.core.taskiq:broker", "app.worker.tasks", "--workers", "1", "--max-async-tasks", "1"]
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - ALGORITHM=HS256
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLAMAPARSE_API_KEY=${LLAMAPARSE_API_KEY:-}
      - OPENAI_MODEL_EMBEDDING=${OPENAI_MODEL_EMBEDDING:-text-embedding-3-small}
      - DOCLING_PAGE_BATCH_SIZE=${DOCLING_PAGE_BATCH_SIZE:-5}
      - INGEST_EMBEDDING_BATCH_SIZE=${INGEST_EMBEDDING_BATCH_SIZE:-20}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      # 미설정 시 계측을 켜고, 빈 값(INGEST_MEASUREMENTS_DIR=)이면 끕니다.
      - INGEST_MEASUREMENTS_DIR=${INGEST_MEASUREMENTS_DIR-/var/log/todac/ingest}
      # 문서 본문 저장은 명시적으로 켠 경우에만 수행합니다.
      - INGEST_CAPTURE_MARKDOWN=${INGEST_CAPTURE_MARKDOWN:-false}
    volumes:
      # 작업·단계별 JSONL 기록을 컨테이너 재생성 후에도 보관합니다.
      - worker_measurements:/var/log/todac/ingest
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - todac-network

  # PostgreSQL 데이터베이스
  postgres:
    image: postgres:16-alpine
    container_name: todac-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - todac-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: todac-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - todac-network

  # Milvus 벡터 데이터베이스
  milvus:
    image: milvusdb/milvus:v2.5.16
    container_name: todac-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5
    restart: unless-stopped
    networks:
      - todac-network

  # Milvus 관리 UI (Attu)
  attu:
    image: zilliz/attu:latest
    container_name: todac-attu
    environment:
      - MILVUS_URL=milvus:19530
    ports:
      - "3001:3000"  # 프론트엔드와 충돌 방지를 위해 3001로 변경
    depends_on:
      - milvus
    restart: unless-stopped
    networks:
      - todac-network

  # 컨테이너 CPU/메모리 수집 (Linux 배포 서버)
  cadvisor:
    image: ghcr.io/google/cadvisor:0.55.1
    container_name: todac-cadvisor
    # 호스트의 컨테이너/cgroup 통계를 읽기 위한 공식 실행 구성
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    command:
      - "--housekeeping_interval=1s"
      - "--allow_dynamic_housekeeping=false"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      - todac-network

  # Prometheus 모니터링
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: todac-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - todac-network

  # Grafana 대시보드
  grafana:
    image: grafana/grafana:13.2.1
    container_name: todac-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    expose:
      - "3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - todac-network

  # Milvus 의존성: etcd
  etcd:
    image: quay.io/coreos/etcd:v3.5.12
    container_name: todac-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - todac-network

  # Milvus 의존성: MinIO
  minio:
    image: minio/minio:latest
    container_name: todac-minio
    environment:
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - todac-network

volumes:
  postgres_data:
  milvus_data:
  etcd_data:
  minio_data:
  prometheus_data:
  grafana_data:
  worker_measurements:

networks:
  todac-network:
    driver: bridge
